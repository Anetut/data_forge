[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
version = "0.1.0"
description = "DataForge - an end-to-end e-commerce data processing platform (Python, Spark, Delta Lake, Azure)."
readme = "README.md"
# Databricks runtimes ship Python 3.11/3.12, so stay compatible with those.
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

# Dependencies are added per phase so each one has a reason to exist:
#   pip install -e ".[dev]"            -> Phase 1
#   pip install -e ".[dev,ingest]"     -> Phase 2
#   pip install -e ".[dev,spark]"      -> Phase 3
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
ingest = [
  "pandas>=2.2",
  "pyarrow>=16",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "faker>=26",
]
spark = [
  "pyspark>=4.0,<4.1",
  "delta-spark>=4.0,<4.1",
]
services = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: needs external services (Postgres, Spark); deselect with -m 'not integration'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
