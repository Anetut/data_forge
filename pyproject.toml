[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataforge"
# Single source of truth: `__version__` in src/dataforge/__init__.py
dynamic = ["version"]
description = "DataForge - an end-to-end e-commerce data processing platform (Python, Spark, Delta Lake, Azure)."
readme = "README.md"
# Databricks runtimes ship Python 3.11/3.12, so stay compatible with those.
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

# Dependencies are added per steps so each one has a reason to exist:
#   pip install -e ".[dev]"            -> Step 1
#   pip install -e ".[dev,ingest]"     -> Step 2
#   pip install -e ".[dev,spark]"      -> Step 3
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  # The [nodejs] extra ships Node as a wheel, so no separate Node install is needed.
  "pyright[nodejs]>=1.1.400",
]
ingest = [
  "pandas>=2.2",
  "pyarrow>=16",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "faker>=26",
]
spark = [
  "pyspark>=4.0,<4.1",
  "delta-spark>=4.0,<4.1",
]
services = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.dynamic]
version = { attr = "dataforge.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: needs external services (Postgres, Spark); deselect with -m 'not integration'",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
# Same engine as VS Code's Pylance, so editor and CI report the same errors.
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
