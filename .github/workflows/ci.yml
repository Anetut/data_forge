name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is now outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The lowest version pyproject.toml supports.
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ingest]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: pytest -m "not integration"

  postgres:
    # The migrations and every integration test, against a fresh Postgres from docker-compose.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Read by docker-compose and by dataforge's connect(); the other settings match the defaults.
      POSTGRES_PASSWORD: ci_only
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres and migrate the main database
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm migrate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ingest]"
      # The test database is rebuilt from the migrations by the fixtures.
      - run: pytest -m integration

  migrations-immutable:
    # An applied migration is never edited, renamed or deleted: Flyway would refuse a changed
    # checksum on every database that already ran it. Fixes go into a new migration.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that existing migrations are unchanged
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --no-renames --diff-filter=MD "$BASE"...HEAD -- sql/migrations/)
          if [ -n "$changed" ]; then
            for f in $changed; do
              echo "::error file=$f::Existing migration changed. Add a new migration instead."
            done
            exit 1
          fi
          echo "Existing migrations unchanged."

  version-bump:
    # Code or schema changes must bump __version__ (SemVer; which part is the author's call).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that __version__ was bumped
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff --quiet "$BASE"...HEAD -- src/ sql/; then
            echo "No changes under src/ or sql/: no version bump needed."
            exit 0
          fi
          version_pattern='^__version__ = "\K[^"]+'
          old=$(git show "$BASE":src/dataforge/__init__.py | grep -oP "$version_pattern")
          new=$(grep -oP "$version_pattern" src/dataforge/__init__.py)
          echo "Version on ${{ github.base_ref }}: $old, on this branch: $new"
          if [ "$old" = "$new" ]; then
            echo "::error file=src/dataforge/__init__.py::src/ or sql/ changed but __version__ is still $new"
            exit 1
          fi
          highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)
          if [ "$highest" != "$new" ]; then
            echo "::error file=src/dataforge/__init__.py::__version__ went down: $old -> $new"
            exit 1
          fi
